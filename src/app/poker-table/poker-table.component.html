<div class="container text-center">
  <span style="
    display: inline-block;
    line-height: 75px;
    margin-top: 15px;
    margin-bottom: 0;
    vertical-align: middle; ">&nbsp;</span>

  @for (card of cardset$ | async; track card) {
    <span [ngClass]="{'card-selected' : selectedVote===card, 'card-disabled':revealed}"
          [attr.disabled]="cardDisabled()" class="card" (click)="vote(card)">{{ card }}</span>
  }
  @if (status) {
    <p class="m-2 status"><small>{{status}}</small></p>
  }
</div>
